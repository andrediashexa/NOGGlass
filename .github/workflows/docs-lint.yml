name: docs-lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: Documentation standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation rules
        run: ./scripts/check-docs.sh
      - name: Check translation parity
        run: ./scripts/check-i18n.sh crates/nogglass-server/ui/messages

      # The site is built in strict mode, so a link to a page that does not
      # exist fails here rather than 404ing for a reader.
      - name: Build the documentation site
        run: docker build -f Dockerfile.docs -t nogglass-docs:ci .
