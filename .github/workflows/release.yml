name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare and publish release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ADR-0014: a patch release ships continuously and is flagged as a
      # pre-release, so GitHub keeps "Latest" pointing at a minor or major
      # version that the maintainers stand behind.
      - name: Mark patch releases as pre-releases
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PATCH: ${{ steps.release.outputs.patch }}
        run: |
          if [ "$PATCH" != "0" ]; then
            echo "$TAG is a patch release; marking it as a pre-release."
            gh release edit "$TAG" --prerelease --latest=false
          else
            echo "$TAG is a minor or major release; leaving it as a full release."
          fi
