name: release

on:
  push:
    branches: [main]
  # Lets the image be rebuilt for a release that already exists, which is how
  # an image is recovered when its build failed or was cancelled.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build an image for, such as v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare and publish release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ADR-0014: a patch release ships continuously and is flagged as a
      # pre-release, so GitHub keeps "Latest" pointing at a minor or major
      # version that the maintainers stand behind.
      - name: Mark patch releases as pre-releases
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PATCH: ${{ steps.release.outputs.patch }}
        run: |
          if [ "$PATCH" != "0" ]; then
            echo "$TAG is a patch release; marking it as a pre-release."
            gh release edit "$TAG" --prerelease --latest=false
          else
            echo "$TAG is a minor or major release; leaving it as a full release."
          fi

  image:
    name: Build and publish the container image
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A patch release is a pre-release (ADR-0014), so it does not move
      # "latest": an operator pulling latest gets a version the maintainers
      # stand behind.
      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          PATCH: ${{ needs.release-please.outputs.patch }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/nogglass
          version="${VERSION:-${MANUAL_TAG#v}}"
          patch="${PATCH:-${version##*.}}"
          minor=${version%.*}
          tags="$image:$version,$image:$minor"
          if [ "$patch" = "0" ]; then
            tags="$tags,$image:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # Both architectures, cross-compiled rather than emulated: the builder
      # stage runs natively and zig links for the target. Emulating the Rust
      # compile instead ran past 30 minutes and was cancelled.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NOGGLASS_VERSION=${{ steps.tags.outputs.version }}
            NOGGLASS_COMMIT=${{ github.sha }}
            NOGGLASS_BUILT_AT=${{ github.event.repository.updated_at }}

      # An image that was pushed but cannot start is worse than no image: the
      # operator finds out, not us. Only the native architecture is started
      # here; an arm64 image cannot run on this runner without the emulation
      # this build exists to avoid.
      - name: Start the image and check it answers
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nogglass:${{ steps.tags.outputs.version }}
        run: |
          printf '[[router]]\nid = "demo"\nname = "Demo"\nvendor = "mock"\nhost = "127.0.0.1"\n' > nogglass.toml
          docker run -d --name smoke -p 8080:8080 \
            -v "$PWD/nogglass.toml:/etc/nogglass/nogglass.toml:ro" "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "The image starts and answers."
              curl -fsS http://127.0.0.1:8080/api/version
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "The image did not answer within a minute."
          docker logs smoke || true
          docker rm -f smoke >/dev/null || true
          exit 1
