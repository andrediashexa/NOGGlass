name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish for, such as v1.1.2"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve-tag:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      patch: ${{ steps.vars.outputs.patch }}
    steps:
      - id: vars
        run: |
          raw_tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${raw_tag#refs/tags/}"
          version="${tag#v}"
          patch="${version##*.}"
          echo "Resolved tag: $tag (version: $version, patch: $patch)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"

  docs-image:
    name: Build and publish the documentation image
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/nogglass-docs
          minor=${VERSION%.*}
          tags="$image:$VERSION,$image:$minor,$image:latest"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

      - name: Start the image and check it serves a page
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nogglass-docs:${{ steps.tags.outputs.version }}
        run: |
          docker run -d --name docs-smoke -p 8081:8081 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8081/wiki/ >/dev/null
              echo "The documentation image starts and serves the wiki."
              docker rm -f docs-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "The documentation image did not answer within a minute."
          docker logs docs-smoke || true
          docker rm -f docs-smoke >/dev/null || true
          exit 1

  image:
    name: Build and publish the container image
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/nogglass
          minor=${VERSION%.*}
          tags="$image:$VERSION,$image:$minor,$image:latest"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NOGGLASS_VERSION=${{ steps.tags.outputs.version }}
            NOGGLASS_COMMIT=${{ github.sha }}
            NOGGLASS_BUILT_AT=${{ github.event.repository.updated_at }}

      - name: Start the image and check it answers
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nogglass:${{ steps.tags.outputs.version }}
        run: |
          printf '[[router]]\nid = "demo"\nname = "Demo"\nvendor = "mock"\nhost = "127.0.0.1"\n' > nogglass.conf
          docker run -d --name smoke -p 8080:8080 \
            -v "$PWD/nogglass.conf:/etc/nogglass/nogglass.conf:ro" "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "The image starts and answers."
              curl -fsS http://127.0.0.1:8080/api/version
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "The image did not answer within a minute."
          docker logs smoke || true
          docker rm -f smoke >/dev/null || true
          exit 1

  binary-linux-amd64:
    name: Build and publish native Linux amd64 binary (host / bare-metal)
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      # We compile a 100% statically linked MUSL binary using the Dockerfile builder stage.
      # This produces a portable, standalone binary that runs on ANY Linux x86_64 distribution
      # without glibc dependencies or external runtime libraries.
      - name: Build static binary with Zig & Musl
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          ver="${VERSION:-1.0.0}"
          echo "Building static Linux amd64 binary for version $ver"

          docker build --target builder \
            --build-arg TARGETARCH=amd64 \
            --build-arg NOGGLASS_VERSION="$ver" \
            --build-arg NOGGLASS_COMMIT="$COMMIT" \
            --build-arg NOGGLASS_BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t nogglass-builder:amd64 .

          mkdir -p dist
          cid=$(docker create nogglass-builder:amd64)
          docker cp "$cid:/nogglass" dist/nogglass
          docker rm "$cid"
          chmod +x dist/nogglass

          # Verify binary architecture and static linkage
          file dist/nogglass
          dist/nogglass --help || true

          # Create distribution package
          pkg="nogglass-v${ver}-linux-amd64"
          mkdir -p "dist/$pkg"
          cp dist/nogglass "dist/$pkg/"
          cp nogglass.example.conf "dist/$pkg/"
          cp routers.example.conf "dist/$pkg/"
          cp ui.example.conf "dist/$pkg/"
          cp deploy/systemd/nogglass.service "dist/$pkg/"
          cp INSTALL.md "dist/$pkg/"
          cp README.md "dist/$pkg/"
          cp LICENSE "dist/$pkg/"

          tar -czvf "dist/${pkg}.tar.gz" -C dist "$pkg"
          (cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256")
          cat "dist/${pkg}.tar.gz.sha256"

      - name: Attach binary tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Uploading native binary assets to release $TAG"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG does not exist yet. Creating release $TAG..."
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
            gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            echo "No tag found for GitHub release upload; skipping."
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nogglass-linux-amd64
          path: dist/*.tar.gz*
