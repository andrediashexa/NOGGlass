name: rust

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff against the base of the pull request.
          fetch-depth: 0

      # This job is a required check, so it has to run and report on every pull
      # request: a check that never runs blocks the merge instead of passing it.
      # It therefore runs always and skips the expensive steps when nothing it
      # compiles has changed.
      - name: Decide whether anything Rust changed
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Cannot diff against a base; building to be safe."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD \
             | grep -qE '^(crates/|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|Dockerfile|\.github/workflows/rust\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Rust sources, manifests, lockfile, toolchain file or Dockerfile changed."
            echo "Skipping the build; this check passes without compiling."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install toolchain
        if: steps.changed.outputs.rust == 'true'
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry and build output
        if: steps.changed.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        if: steps.changed.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Lints
        if: steps.changed.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.changed.outputs.rust == 'true'
        run: cargo test --workspace --all-targets

      - name: Release build
        if: steps.changed.outputs.rust == 'true'
        run: cargo build --workspace --release
