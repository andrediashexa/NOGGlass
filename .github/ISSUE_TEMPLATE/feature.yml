name: Feature
description: A capability the Looking Glass should gain
title: "feat: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per feature. Work happens on a branch named
        `feat/<this issue number>-<slug>` and lands as one squashed pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can an operator or a visitor not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built? Mention affected vendors when relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines "done".
      value: |
        - [ ] 
        - [ ] Documentation updated
        - [ ] Translations added for pt-BR, en and es (if user-facing)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - executor
        - vendor driver
        - infra
        - docs
        - ci
    validations:
      required: true
