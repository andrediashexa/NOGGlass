# NOGGlass configuration.
#
# Copy this file to /etc/nogglass/nogglass.toml and edit it. NOGGlass validates
# it at startup and refuses to run if it does not understand it: a Looking Glass
# that starts with a broken inventory would answer visitors with surprises.
#
# This file carries NO secrets. Passwords and key passphrases are named here and
# read from the environment, so the file itself can live in version control.

[limits]
# Wall-clock budget for one command, in seconds.
timeout_secs = 30
# Router output kept per query. Anything past this is dropped and the answer is
# flagged as truncated; a legitimate single-prefix answer is kilobytes.
max_output_bytes = 262144
# Probes per ping. Clamped to 20 whatever is configured here.
ping_count = 5
# Queries that may run at once against one router. Keep this low: the CPU you
# are spending belongs to a production control plane.
max_concurrent_per_router = 2
# Queries that may run at once across the whole instance.
max_concurrent_total = 16

# ---------------------------------------------------------------------------
# Routers. One [[router]] block each.
#
#   id          stable, appears in URLs — do not change it after publishing
#   name        what visitors see
#   vendor      one of: huawei_vrp, cisco_iosxe, cisco_iosxr, juniper_junos,
#               nokia_sros, mikrotik_routeros, datacom_dmos,
#               bird_routing_daemon, arista_eos, frr, mock
#   host        management address; never shown to visitors
#   username    the read-only user you created for NOGGlass
#   credentials password_env = "VAR", or key_file = { path = "...",
#               passphrase_env = "VAR" }
#   host_key    OpenSSH public key ("ssh-ed25519 AAAA..."); recommended in production
#               to pin the router identity and prevent Man-in-the-Middle attacks
#   location    grouping in the selector, usually a POP or a city
#   queries     which queries this router answers: "ping", "traceroute", "bgp_route",
#               "bgp_aspath" (AS-Path regex matching neighbor peer ASN), "bgp_summary".
#               Omit to allow default safe queries (ping, traceroute, bgp_route, bgp_summary).
#               NOTE: "bgp_aspath" is opt-in and omitted on large Tier 1 transit borders
#               to protect control-plane CPU against regex full-table scans.
# ---------------------------------------------------------------------------

[[router]]
id = "edge-01"
name = "Edge 01"
vendor = "huawei_vrp"
host = "192.0.2.10"
# host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICc7T1sX7Zq4eN18Hq9T0kL1m3oV5yP7rS9tU2vW4xY0"
username = "nogglass"
location = "Sao Paulo"
credentials = { password_env = "NOGGLASS_EDGE01_PASSWORD" }
queries = ["ping", "traceroute", "bgp_route", "bgp_summary"]

[[router]]
id = "border-02"
name = "Border 02"
vendor = "juniper_junos"
host = "192.0.2.11"
username = "nogglass"
location = "Rio de Janeiro"
credentials = { key_file = { path = "/etc/nogglass/keys/border-02", passphrase_env = "NOGGLASS_BORDER02_PASSPHRASE" } }

# The mock router answers from fixtures and never opens a session. Useful for
# trying NOGGlass out, and for a public demo. Its answers are fabricated and the
# interface says so.
[[router]]
id = "demo"
name = "Demo router"
vendor = "mock"
host = "127.0.0.1"
location = "Fixtures"

# ---------------------------------------------------------------------------
# RPKI validation (ADR-0010).
#
# Tier 1 is whatever your router reported: if it has an RTR session, its answer
# is used and nothing leaves your network.
#
# Tier 2 fills the blanks for routers that report nothing. It is OFF by default.
# With enable_fallback and no validator_url, NOGGlass asks RIPEstat, which means
# the queried prefix and origin AS leave your network — mention it in your
# privacy notice, or point validator_url at your own validator.
# ---------------------------------------------------------------------------

[rpki]
enable_fallback = false
# validator_url = "http://routinator.internal:8323"
timeout_ms = 3000
cache_ttl_secs = 3600
cache_max_capacity = 50000

# ---------------------------------------------------------------------------
# Rate limiting.
#
# The limits above bound one query. These bound how many queries one visitor
# gets. On a public instance, leave this on: without it a single stranger
# decides how much control-plane CPU your routers spend.
#
# IPv6 is counted per /64, not per address, because one visitor holds a whole
# /64 and counting per address counts nothing.
#
# trusted_proxies: only these addresses have their X-Forwarded-For believed.
# Leave it empty when nothing sits in front. Listing an address you do not
# control hands that address an unlimited allowance.
# ---------------------------------------------------------------------------

[rate_limit]
enabled = true
max_requests = 20
window_secs = 60
burst = 5
# Interval in seconds within which subsequent queries require CAPTCHA challenge (default 60)
require_captcha_within_secs = 60
trusted_proxies = []
# trusted_proxies = ["192.0.2.1", "2001:db8::1"]

# ---------------------------------------------------------------------------
# Global view.
#
# Shows what the Internet announces for the queried prefix next to what your
# router answered, which is how a leak, a hijack or an announcement that never
# propagated becomes visible.
#
# OFF by default: it sends the queried prefix to RIPEstat, so it leaves your
# network and belongs in your privacy notice.
# ---------------------------------------------------------------------------

[global_view]
enabled = false
timeout_ms = 1500

# ---------------------------------------------------------------------------
# User interface & visual appearance.
#
# Customise the theme, branding logo, background wallpaper, and visual effects.
# ---------------------------------------------------------------------------

[ui]
# Visual theme: "dark" (default) or "light".
theme = "dark"

# Path to logo image file on the host (PNG, SVG, JPEG, WebP).
# When this file does not exist, the built-in NOGGlass logo is used as fallback.
logo_path = "/etc/nogglass/logo_nogglass.png"

# Logo height in pixels (default 76).
logo_height_px = 76

# Path to background image file on the host (PNG, JPEG, WebP).
# When this file does not exist, the built-in background wallpaper is used as fallback.
background_path = "/etc/nogglass/nogglass.png"

# Background blur radius in pixels (default 1).
background_blur_px = 1

# Background opacity percentage from 0 to 100 (default 35).
background_opacity_percent = 35

# Result panels visibility (default: true for all three).
# When set to false, that specific output section is not displayed in the interface.
# - show_best_path: "Best Path" (AS-Path topology diagram / graph)
# - show_paths: "Paths" (Tabular BGP paths list)
# - show_raw_output: "Router Output" (Raw CLI output from the router)
show_best_path = true
show_paths = true
show_raw_output = true

