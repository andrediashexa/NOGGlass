# NOGGlass user interface and visual appearance configuration.
#
# Copy this file to /etc/nogglass/ui.conf and edit it.
# NOGGlass automatically loads this file when present in the same directory
# as nogglass.conf (or configured via NOGGLASS_UI_CONFIG).
#
# Customise the theme, branding logo, background wallpaper, and visual effects.

[ui]
# Visual theme: "dark" (default) or "light".
theme = "dark"

# Path to logo image file on the host (PNG, SVG, JPEG, WebP).
# When this file does not exist, the built-in NOGGlass logo is used as fallback.
# For light theme, point to "/etc/nogglass/logo_nogglass_light.png".
logo_path = "/etc/nogglass/logo_nogglass_dark.png"

# Logo height in pixels (default 76).
logo_height_px = 76

# Path to background image file on the host (PNG, JPEG, WebP).
# When this file does not exist, the built-in background wallpaper is used as fallback.
# For light theme, point to "/etc/nogglass/nogglass_light.png".
background_path = "/etc/nogglass/nogglass_dark.png"

# Background blur radius in pixels (default 1).
background_blur_px = 1

# Background opacity percentage from 0 to 100 (default 35).
background_opacity_percent = 35

# Result panels visibility (default: true for all three).
# When set to false, that specific output section is not displayed in the interface.
# - show_best_path: "Best Path" (AS-Path topology diagram / graph)
# - show_paths: "Paths" (Tabular BGP paths list)
# - show_raw_output: "Router Output" (Raw CLI output from the router)
show_best_path = true
show_paths = true
show_raw_output = true
