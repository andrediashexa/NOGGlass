[package]
name = "looking-glass-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
regex = "1.10"
ipnet.workspace = true
serde = { version = "1.0", features = ["derive"] }
# ring rather than the default aws-lc-rs backend: aws-lc-sys needs cmake and a
# C toolchain, which turns a "cargo build" into a build-tools hunt for anyone
# packaging this. ring builds with the Rust toolchain alone.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
