[package]
name = "looking-glass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
regex = "1.10"
# rustls rather than the system OpenSSL: one fewer thing an operator has to
# have installed, and it matches the crypto backend russh already uses.
# rustls with the ring provider, not the default aws-lc-rs: aws-lc-sys needs
# cmake and a C toolchain, and russh already brings ring in. One crypto
# backend, no build-tools hunt for whoever packages this.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ipnet.workspace = true
serde = { version = "1.0", features = ["derive"] }
# ring rather than the default aws-lc-rs backend: aws-lc-sys needs cmake and a
# C toolchain, which turns a "cargo build" into a build-tools hunt for anyone
# packaging this. ring builds with the Rust toolchain alone.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
ring.workspace = true
netgauze-bgp-pkt = "0.13"
netgauze-bgp-speaker = "0.13"
netgauze-bmp-pkt = { version = "0.13", features = ["codec"] }
# codec (BmpCodec) + FramedRead let the station read length-delimited BMP
# messages off a TcpStream; tokio-stream's StreamExt drives the frame loop.
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Encoding a BMP message to raw bytes in the station's loopback tests.
bytes = "1"
