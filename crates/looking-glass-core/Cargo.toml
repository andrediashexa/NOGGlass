[package]
name = "looking-glass-core"
version = "0.1.0"
edition = "2021"
# LazyLock (lib.rs) requires 1.80; CI pins the exact toolchain.
rust-version = "1.80"

[dependencies]
async-trait = "0.1"
regex = "1.10"
ipnet = { version = "2.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# ring rather than the default aws-lc-rs backend: aws-lc-sys needs cmake and a
# C toolchain, which turns a "cargo build" into a build-tools hunt for anyone
# packaging this. ring builds with the Rust toolchain alone.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
