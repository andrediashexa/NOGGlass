<!doctype html>
<html lang="en" data-locale="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NOGGlass</title>
    <link rel="stylesheet" href="/assets/app.css?v=1.2.1" />
    <!-- NOGGLASS_CUSTOM_VARS -->
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo_nogglass.png" alt="NOGGlass" />
        <span class="brand-tagline" data-i18n="app.tagline"></span>
      </div>
      <nav class="locales" aria-label="Language">
        <a href="/pt/" hreflang="pt-BR" data-locale-link="pt">PT</a>
        <a href="/en/" hreflang="en" data-locale-link="en">EN</a>
        <a href="/es/" hreflang="es" data-locale-link="es">ES</a>
      </nav>
    </header>

    <main>
      <form id="query-form" class="query">
        <label class="field">
          <span data-i18n="form.router"></span>
          <select id="router" name="router" required></select>
        </label>

        <label class="field">
          <span data-i18n="form.query"></span>
          <select id="query-type" name="type" required></select>
        </label>

        <label class="field field-grow">
          <span data-i18n="form.target"></span>
          <input
            id="target"
            name="target"
            type="text"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </label>

        <div class="form-actions">
          <button type="submit" id="submit"><span data-i18n="form.submit"></span></button>
          <button type="button" id="clear-btn" class="btn-clear"><span data-i18n="form.clear"></span></button>
        </div>
      </form>

      <dialog id="captcha-modal" class="captcha-modal">
        <form method="dialog" id="captcha-form" class="captcha-box">
          <h3 data-i18n="captcha.title"></h3>
          <p class="captcha-desc" data-i18n="captcha.desc"></p>
          <div class="captcha-visual">
            <div id="captcha-svg-container" class="captcha-svg"></div>
            <button type="button" id="captcha-refresh" class="btn-refresh" title="Refresh">↻</button>
          </div>
          <input type="hidden" id="captcha-id" name="captcha-id" />
          <div class="captcha-input-row">
            <input
              type="text"
              id="captcha-input"
              name="captcha-input"
              maxlength="5"
              autocomplete="off"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="characters"
              required
            />
            <button type="submit" id="captcha-submit" class="btn-submit">
              <span data-i18n="captcha.submit"></span>
            </button>
          </div>
          <p id="captcha-error" class="captcha-error-text" hidden></p>
        </form>
      </dialog>

      <p id="mock-warning" class="notice notice-mock" hidden data-i18n="mock.warning"></p>
      <p id="error" class="notice notice-error" hidden role="alert"></p>

      <section id="graph-panel" class="panel" hidden>
        <h2 data-i18n="result.best_path"></h2>
        <!-- The graph is decorative on its own; the table below carries the
             same information for anyone who cannot see it. -->
        <div id="graph" role="img" aria-describedby="paths-table"></div>
      </section>

      <section id="paths-panel" class="panel" hidden>
        <h2 data-i18n="result.paths"></h2>
        <div class="table-scroll">
          <table id="paths-table">
            <thead>
              <tr>
                <th data-i18n="table.prefix"></th>
                <th data-i18n="table.next_hop"></th>
                <th data-i18n="table.as_path"></th>
                <th data-i18n="table.local_pref"></th>
                <th data-i18n="table.med"></th>
                <th data-i18n="table.age"></th>
                <th data-i18n="table.origin"></th>
                <th data-i18n="table.rpki"></th>
                <th data-i18n="table.communities"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="sessions-panel" class="panel" hidden>
        <h2 data-i18n="summary.title"></h2>
        <p id="sessions-meta" class="meta"></p>
        <div class="table-scroll">
          <table id="sessions-table">
            <thead>
              <tr>
                <th data-i18n="summary.peer"></th>
                <th data-i18n="summary.asn"></th>
                <th data-i18n="summary.state"></th>
                <th data-i18n="summary.uptime"></th>
                <th data-i18n="summary.prefixes"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="hops-panel" class="panel" hidden>
        <h2 data-i18n="traceroute.title"></h2>
        <div class="table-scroll">
          <table id="hops-table">
            <thead>
              <tr>
                <th data-i18n="traceroute.hop"></th>
                <th data-i18n="traceroute.address"></th>
                <th data-i18n="traceroute.rtt"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="global-panel" class="panel" hidden>
        <h2 data-i18n="global.title"></h2>
        <p id="global-verdict" class="verdict"></p>
        <dl id="global-facts" class="facts"></dl>
      </section>

      <section id="raw-panel" class="panel" hidden>
        <h2 data-i18n="result.raw"></h2>
        <p id="result-meta" class="meta"></p>
        <pre id="raw"></pre>
      </section>
    </main>

    <footer>
      <a id="project-link" href="https://github.com/andrediashexa/looking-glass" target="_blank" rel="noopener noreferrer">
        <span data-i18n="footer.project"></span> <span id="version">1.2.1</span>
      </a>
      <span id="build-meta" class="meta" hidden></span>
    </footer>

    <script src="/assets/app.js?v=1.2.1" type="module"></script>
  </body>
</html>
