# Serves the built documentation site.
#
# Port 8081 rather than 80: the port is above 1024 so the server runs as a
# normal user, and 8080 already belongs to NOGGlass itself on the same host.

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Directory URLs: /wiki/2-your-first-query/ is a directory holding
    # index.html. Anything genuinely missing gets the site's own 404 page,
    # which keeps the navigation and the search box on screen.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Hashed assets never change under their name; the HTML does.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
