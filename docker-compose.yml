# NOGGlass, the boring way to run it.
#
#   docker compose up -d
#
# Brings up two containers: the looking glass on 8080 and its documentation on
# 8081. Both images are published to GHCR, so nothing is compiled here. To build
# from source instead, uncomment the build sections.

services:
  nogglass:
    # Uses locally built image or registry image
    image: nogglass:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nogglass
    restart: unless-stopped
    # Measured at 16 MB of RSS serving the mock in a debug build; the ceiling
    # leaves room for concurrent SSH sessions and their output buffers, which
    # is where the memory actually goes under load. Enabling the local BGP
    # session (#171) or the BMP station (#172) adds a RIB whose memory scales
    # with the number of prefixes held; raise this limit for a full table.
    mem_limit: 128m
    memswap_limit: 128m
    # Only the HTTP port is published. Put a reverse proxy in front for TLS
    # (ADR-0012); NOGGlass warns at startup when it is public without one.
    ports:
      - "127.0.0.1:8080:8080"
      # The BGP session and BMP station are off by default (safe defaults). When
      # you turn one on, its port is the documented exception to "only the proxy
      # is published" — publish it and firewall it to your routers:
      #   - BMP station (#172): routers always dial in, so publish the [bmp]
      #     listen port (11019 by convention) whenever [bmp] is enabled.
      # - "11019:11019"
      #   - Local BGP session (#171): NOGGlass dials the router, so no inbound
      #     port is needed unless you configure a passive peer, which listens.
      # - "179:179"
    volumes:
      # Named volume for container-managed configuration that survives image upgrades
      - nogglass-config:/etc/nogglass
    # Router secrets and variables are read from a local nogglass.env,
    # from .env, or directly from the /etc/nogglass named volume.
    env_file:
      - path: nogglass.env
        required: false
      - path: .env
        required: false
      - path: /etc/nogglass/nogglass.env
        required: false
    environment:
      NOGGLASS_LOG: "${NOGGLASS_LOG:-info}"
      NOGGLASS_DEFAULT_LOCALE: "${NOGGLASS_DEFAULT_LOCALE:-en}"
      # Set when a proxy terminates TLS, so the startup warning stays quiet and
      # forwarded headers are honoured from it.
      # NOGGLASS_BEHIND_PROXY: "true"
    networks:
      - default

  # The manual, beside the tool.
  # If you do not have the docs image locally, run `docker compose up -d nogglass`
  # to launch only the looking glass service.
  docs:
    image: ghcr.io/andrediashexa/nogglass-docs:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.docs
    container_name: nogglass-docs
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - default

volumes:
  nogglass-config:
    name: nogglass-config

networks:
  default:
    driver: bridge
    enable_ipv6: true


