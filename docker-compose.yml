# NOGGlass, the boring way to run it.
#
#   docker compose up -d
#
# Brings up two containers: the looking glass on 8080 and its documentation on
# 8081. Both images are published to GHCR, so nothing is compiled here. To build
# from source instead, uncomment the build sections.

services:
  nogglass:
    # Published for linux/amd64 and linux/arm64.
    image: ghcr.io/andrediashexa/nogglass:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: nogglass
    restart: unless-stopped
    # Measured at 16 MB of RSS serving the mock in a debug build; the ceiling
    # leaves room for concurrent SSH sessions and their output buffers, which
    # is where the memory actually goes under load.
    mem_limit: 128m
    memswap_limit: 128m
    # Only the HTTP port is published. Put a reverse proxy in front for TLS
    # (ADR-0012); NOGGlass warns at startup when it is public without one.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # routers.toml, SSH keys and anything else the operator edits. A named
      # volume survives image upgrades.
      - nogglass-config:/etc/nogglass
    environment:
      # Router passwords are named in the configuration file and read from here,
      # so the file itself stays free of secrets.
      # NOGGLASS_EDGE01_PASSWORD: "${NOGGLASS_EDGE01_PASSWORD}"
      NOGGLASS_LOG: "${NOGGLASS_LOG:-info}"
      NOGGLASS_DEFAULT_LOCALE: "${NOGGLASS_DEFAULT_LOCALE:-en}"
      # Set when a proxy terminates TLS, so the startup warning stays quiet and
      # forwarded headers are honoured from it.
      # NOGGLASS_BEHIND_PROXY: "true"
    networks:
      - default

  # The manual, beside the tool. Remove this block, or run
  # `docker compose up -d nogglass`, if you do not want it: nothing else
  # depends on it.
  docs:
    # The same tag as the server above, deliberately: both images are published
    # by one release with one version number, so following `latest` on both
    # keeps the manual describing the binary beside it. An operator who pins the
    # server MUST pin this to the same number, or the pages will drift ahead of
    # what their binary does.
    image: ghcr.io/andrediashexa/nogglass-docs:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.docs
    container_name: nogglass-docs
    restart: unless-stopped
    # Measured at 7.4 MB of RSS serving the built site. nginx allocates per
    # worker and the site is static, so the number barely moves under load; the
    # ceiling is room for the workers a larger host starts, not for growth.
    mem_limit: 64m
    memswap_limit: 64m
    # Read-only files and nothing else: no volume, no configuration, no
    # secrets. Put it behind the same proxy as the looking glass, on its own
    # name (docs.example.net), and serve it over TLS.
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - default

# An operator whose routers filter SSH by source address and who needs the
# host's exact IPv6 address can swap the port publishing above for:
#   network_mode: host
# It costs the container's network isolation, so it is opt-in (ADR-0012).

volumes:
  nogglass-config:
    name: nogglass-config

networks:
  default:
    driver: bridge
    enable_ipv6: true
