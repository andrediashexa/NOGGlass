! FRR "A" for verifying NOGGlass's BMP station (issue #172). This router
! originates two documentation prefixes and advertises them to FRR "B", so B
! has something in its Adj-RIB-In to stream to NOGGlass over BMP.
frr defaults traditional
!
router bgp 65002
 bgp router-id 172.30.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.0.3 remote-as 65003
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  neighbor 172.30.0.3 activate
 exit-address-family
!
ip route 203.0.113.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
