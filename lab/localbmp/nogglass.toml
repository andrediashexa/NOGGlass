# Sample inventory to verify the BMP station against the FRR pair here.
# A mock router satisfies the "at least one router" rule; the [bmp] section is
# the part under test. NOGGlass listens on the docker bridge so FRR "B" (at
# 172.30.0.3) can dial it at the gateway 172.30.0.1.
[[router]]
id = "mock"
name = "Mock"
vendor = "mock"
host = "127.0.0.1"

[bmp]
enabled = true
listen = ["0.0.0.0:11019"]

[[bmp.router]]
id = "lab-frr-b"
address = "172.30.0.3"
description = "FRR B, the BMP exporter"
