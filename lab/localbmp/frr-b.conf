! FRR "B" for verifying NOGGlass's BMP station (issue #172). It peers with FRR
! "A", receives A's routes, and exports its Adj-RIB-In to NOGGlass over BMP so
! the station's RIB fills with A's prefixes keyed by A's address.
frr defaults traditional
!
router bgp 65003
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 bmp targets nog
  bmp connect 172.30.0.1 port 11019 min-retry 1000 max-retry 5000
  bmp monitor ipv4 unicast post-policy
 exit
!
