! peer-b — AS 64497.
!
! Originates the upper half of 198.51.100.0/24 with an explicit MED of zero,
! and 192.0.2.128/25 carrying every kind of community at once. It also carries
! 203.0.113.0/24 with a short path, so the device under test has to choose
! between this and peer-a's long one.
!
! The MED matters: peer-a sets none at all on what it originates. A router that
! prints 0 for both is lying, and this lab is where that is caught (ADR-0006).
frr defaults traditional
hostname peer-b
log stdout
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 203.0.113.2/32
 ipv6 address 2001:db8:beef::2/128
!
interface eth1
 description to the device under test
 ip address 192.0.2.6/30
 ipv6 address 2001:db8:0:2::2/64
!
interface eth2
 description to peer-c
 ip address 192.0.2.17/30
 ipv6 address 2001:db8:0:5::1/64
!
ip route 198.51.100.128/25 blackhole
ip route 192.0.2.128/25 blackhole
ipv6 route 2001:db8:beef:abcd::1/128 blackhole
!
router bgp 64497
 bgp router-id 192.0.2.6
 ! Without this, every neighbour is activated for IPv4 unicast -
 ! including the IPv6-addressed ones, which then carry IPv4 prefixes over
 ! an IPv6 session. That leak put the device under test's own AS inside
 ! peer-c's AS_SET, and the aggregate came back unusable as a result.
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.5 remote-as 64499
 neighbor 192.0.2.18 remote-as 64498
 neighbor 2001:db8:0:2::1 remote-as 64499
 neighbor 2001:db8:0:5::2 remote-as 64498
 !
 address-family ipv4 unicast
  network 198.51.100.128/25
  network 192.0.2.128/25
  neighbor 192.0.2.5 activate
  neighbor 192.0.2.5 route-map TO-DUT out
  neighbor 192.0.2.18 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:beef:abcd::1/128
  neighbor 2001:db8:0:2::1 activate
  neighbor 2001:db8:0:2::1 route-map TO-DUT-V6 out
  neighbor 2001:db8:0:5::2 activate
 exit-address-family
!
ip prefix-list ORIGINATED seq 5 permit 198.51.100.128/25
ip prefix-list COMMUNITIES seq 5 permit 192.0.2.128/25
ip prefix-list TRANSIT seq 5 permit 203.0.113.0/24
!
! An explicit zero. Absent is a different fact and peer-a carries that one.
route-map TO-DUT permit 10
 match ip address prefix-list ORIGINATED
 set metric 0
 set as-path prepend 65543
!
! Standard, well-known and large at once, on one prefix.
route-map TO-DUT permit 20
 match ip address prefix-list COMMUNITIES
 set community 64497:100 64497:200 no-export additive
 set large-community 64497:1:2
 set metric 4294967294
!
route-map TO-DUT permit 30
 match ip address prefix-list TRANSIT
 set metric 100
!
route-map TO-DUT permit 40
!
route-map TO-DUT-V6 permit 10
 set community 64497:100 no-export additive
!
line vty
!
