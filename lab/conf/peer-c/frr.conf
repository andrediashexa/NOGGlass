! peer-c — AS 64498.
!
! Two jobs. It originates what the lab can actually reach — 203.0.113.0/24 and
! 2001:db8:beef::/48, with its loopback inside both — so ping and traceroute
! from the device under test have a real destination two or three hops away.
!
! And it aggregates the two halves of 198.51.100.0/24 that peer-a and peer-b
! originate, with as-set. The components arrive with different AS paths, so the
! aggregate leaves here carrying an AS_SET: a path column that contains
! {64496,64497,65536,65543} rather than a list of numbers. Parsers that assume
! every element of a path is an integer break on exactly this.
frr defaults traditional
hostname peer-c
log stdout
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 203.0.113.3/32
 ipv6 address 2001:db8:beef::3/128
!
interface eth1
 description to the device under test
 ip address 192.0.2.10/30
 ipv6 address 2001:db8:0:3::2/64
!
interface eth2
 description to peer-a
 ip address 192.0.2.14/30
 ipv6 address 2001:db8:0:4::2/64
!
interface eth3
 description to peer-b
 ip address 192.0.2.18/30
 ipv6 address 2001:db8:0:5::2/64
!
interface eth4
 description to far
 ip address 192.0.2.21/30
 ipv6 address 2001:db8:0:6::1/64
!
router bgp 64498
 bgp router-id 192.0.2.10
 ! Without this, every neighbour is activated for IPv4 unicast -
 ! including the IPv6-addressed ones, which then carry IPv4 prefixes over
 ! an IPv6 session. That leak put the device under test's own AS inside
 ! peer-c's AS_SET, and the aggregate came back unusable as a result.
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.9 remote-as 64499
 neighbor 192.0.2.13 remote-as 64496
 neighbor 192.0.2.17 remote-as 64497
 neighbor 2001:db8:0:3::1 remote-as 64499
 neighbor 2001:db8:0:4::1 remote-as 64496
 neighbor 2001:db8:0:5::1 remote-as 64497
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  aggregate-address 198.51.100.0/24 as-set summary-only
  neighbor 192.0.2.9 activate
  neighbor 192.0.2.13 activate
  neighbor 192.0.2.17 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:beef::/48
  neighbor 2001:db8:0:3::1 activate
  neighbor 2001:db8:0:4::1 activate
  neighbor 2001:db8:0:5::1 activate
 exit-address-family
!
! The covering route has to exist for the network statement to originate it;
! the loopback inside it is what answers a ping.
ip route 203.0.113.0/24 blackhole 250
ipv6 route 2001:db8:beef::/48 blackhole 250
!
! More specific than the blackhole, so what is announced as one /24 is really
! two things: an address on this router that answers, and one a hop further
! away. A traceroute that ends on the first hop tests nothing.
ip route 203.0.113.8/29 192.0.2.22
ipv6 route 2001:db8:beef:f::/64 2001:db8:0:6::2
!
line vty
!
