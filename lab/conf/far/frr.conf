! far — the destination behind peer-c.
!
! It exists so a traceroute from the device under test has more than one hop.
! A one-hop traceroute exercises nothing: the parser's hard case is the hop in
! the middle, and there has to be a middle for that.
frr defaults traditional
hostname far
log stdout
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 203.0.113.10/32
 ipv6 address 2001:db8:beef:f::10/128
!
interface eth1
 description to peer-c
 ip address 192.0.2.22/30
 ipv6 address 2001:db8:0:6::2/64
!
! Routes back towards the lab, not a default: containerlab gives every node a
! management interface with a default route of its own, and a second default
! here would be a race nobody needs. The lab's addressing is known, so name it.
ip route 192.0.2.0/24 192.0.2.21
ip route 198.51.100.0/24 192.0.2.21
ipv6 route 2001:db8::/32 2001:db8:0:6::1
!
line vty
!
