! peer-a — AS 64496.
!
! Originates the lower half of 198.51.100.0/24 and one host route, and carries
! 203.0.113.0/24 from peer-c to the device under test with a deliberately long
! AS path. Eight ASNs is more than most CLIs fit on a line, and the line they
! wrap it onto is where parsers lose the prefix.
frr defaults traditional
hostname peer-a
log stdout
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 203.0.113.1/32
 ipv6 address 2001:db8:beef::1/128
!
interface eth1
 description to the device under test
 ip address 192.0.2.2/30
 ipv6 address 2001:db8:0:1::2/64
!
interface eth2
 description to peer-c
 ip address 192.0.2.13/30
 ipv6 address 2001:db8:0:4::1/64
!
! Blackholes rather than import-check off: the prefix exists in the table the
! way it would on a real network, and a packet for it is dropped here instead
! of following a default back out.
ip route 198.51.100.0/25 blackhole
ip route 198.51.100.42/32 blackhole
!
router bgp 64496
 bgp router-id 192.0.2.2
 no bgp ebgp-requires-policy
 neighbor 192.0.2.1 remote-as 64499
 neighbor 192.0.2.14 remote-as 64498
 neighbor 2001:db8:0:1::1 remote-as 64499
 neighbor 2001:db8:0:4::2 remote-as 64498
 !
 address-family ipv4 unicast
  network 198.51.100.0/25
  network 198.51.100.42/32
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 route-map TO-DUT out
  neighbor 192.0.2.14 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:1::1 activate
  neighbor 2001:db8:0:1::1 route-map TO-DUT-V6 out
  neighbor 2001:db8:0:4::2 activate
 exit-address-family
!
ip prefix-list TRANSIT seq 5 permit 203.0.113.0/24
ipv6 prefix-list TRANSIT-V6 seq 5 permit 2001:db8:beef::/48
!
! The long path goes only on what this peer carries in transit; what it
! originates keeps a short one, so the two are told apart in the table.
route-map TO-DUT permit 10
 match ip address prefix-list TRANSIT
 set as-path prepend 64496 64496 65536 65537 65538 65539 65540 65541
!
route-map TO-DUT permit 20
 set as-path prepend 65536
!
route-map TO-DUT-V6 permit 10
 match ipv6 address prefix-list TRANSIT-V6
 set as-path prepend 64496 64496 65536 65537 65538 65539 65540 65541
!
route-map TO-DUT-V6 permit 20
 set as-path prepend 65536
!
line vty
!
