# BIRD 2 as the device under test.
#
# Same addressing and the same four neighbours as every other DUT in this lab,
# including the one at 192.0.2.126 that never answers. It exports nothing: a
# looking glass router has no customers, and here it also keeps this router's
# AS out of peer-c's AS_SET, which is what makes the aggregate readable.

log stderr all;
router id 192.0.2.1;

protocol device { }

# No kernel protocol: this router is looked at, not routed through, and a lab
# node that installs routes into its own namespace is a surprise nobody needs.

template bgp peers {
    local as 64499;
    ipv4 {
        import all;
        export none;
    };
}

template bgp peers6 {
    local as 64499;
    ipv6 {
        import all;
        export none;
    };
}

protocol bgp peer_a from peers {
    local 192.0.2.1 as 64499;
    neighbor 192.0.2.2 as 64496;
}

protocol bgp peer_b from peers {
    local 192.0.2.5 as 64499;
    neighbor 192.0.2.6 as 64497;
}

protocol bgp peer_c from peers {
    local 192.0.2.9 as 64499;
    neighbor 192.0.2.10 as 64498;
}

# Never answers, on purpose: a summary where every session is established does
# not test the summary parser.
protocol bgp never from peers {
    local 192.0.2.1 as 64499;
    neighbor 192.0.2.126 as 64511;
}

protocol bgp peer_a_v6 from peers6 {
    local 2001:db8:0:1::1 as 64499;
    neighbor 2001:db8:0:1::2 as 64496;
}

protocol bgp peer_b_v6 from peers6 {
    local 2001:db8:0:2::1 as 64499;
    neighbor 2001:db8:0:2::2 as 64497;
}

protocol bgp peer_c_v6 from peers6 {
    local 2001:db8:0:3::1 as 64499;
    neighbor 2001:db8:0:3::2 as 64498;
}
