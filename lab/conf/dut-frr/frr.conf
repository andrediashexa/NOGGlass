! dut-frr — AS 64499, the reference device under test.
!
! This node exists so the lab and the capture script can be exercised without
! any licensed vendor image. It is not a vendor NOGGlass supports today; its
! output is the yardstick the vendor nodes are compared against, and the reason
! a run that produces nothing can be told from a run that produced nothing
! useful.
!
! The last neighbour is deliberate: 192.0.2.126 answers nothing, ever. A
! summary with every session established does not test the summary parser, and
! "a number in the state column means the session is up" is precisely the rule
! that needs a session which is not.
frr defaults traditional
hostname dut-frr
log stdout
ip forwarding
ipv6 forwarding
!
interface eth1
 description to peer-a
 ip address 192.0.2.1/30
 ipv6 address 2001:db8:0:1::1/64
!
interface eth2
 description to peer-b
 ip address 192.0.2.5/30
 ipv6 address 2001:db8:0:2::1/64
!
interface eth3
 description to peer-c
 ip address 192.0.2.9/30
 ipv6 address 2001:db8:0:3::1/64
!
router bgp 64499
 bgp router-id 192.0.2.1
 ! Without this, every neighbour is activated for IPv4 unicast -
 ! including the IPv6-addressed ones, which then carry IPv4 prefixes over
 ! an IPv6 session. That leak put the device under test's own AS inside
 ! peer-c's AS_SET, and the aggregate came back unusable as a result.
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 64496
 neighbor 192.0.2.6 remote-as 64497
 neighbor 192.0.2.10 remote-as 64498
 neighbor 192.0.2.126 remote-as 64511
 neighbor 192.0.2.126 description a session that will never come up
 neighbor 2001:db8:0:1::2 remote-as 64496
 neighbor 2001:db8:0:2::2 remote-as 64497
 neighbor 2001:db8:0:3::2 remote-as 64498
 !
 address-family ipv4 unicast
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map ANNOUNCE-NOTHING out
  neighbor 192.0.2.6 activate
  neighbor 192.0.2.6 route-map ANNOUNCE-NOTHING out
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.10 route-map ANNOUNCE-NOTHING out
  neighbor 192.0.2.126 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:1::2 activate
  neighbor 2001:db8:0:1::2 route-map ANNOUNCE-NOTHING out
  neighbor 2001:db8:0:2::2 activate
  neighbor 2001:db8:0:2::2 route-map ANNOUNCE-NOTHING out
  neighbor 2001:db8:0:3::2 activate
  neighbor 2001:db8:0:3::2 route-map ANNOUNCE-NOTHING out
 exit-address-family
!
! A looking glass router announces nothing to its peers, and here that is not
! only realism. With the DUT re-advertising between the peers, its own AS ends
! up inside peer-c's AS_SET, and the aggregate then comes back carrying 64499 —
! which the DUT drops as a loop. The most interesting route in the lab was
! invisible until this was added.
route-map ANNOUNCE-NOTHING deny 10
!
line vty
!
