! An FRR peer for verifying NOGGlass's own BGP session (issue #171).
! NOGGlass dials this router; FRR accepts the session and advertises two
! documentation prefixes so the local RIB has something to hold.
frr defaults traditional
!
router bgp 65001
 bgp router-id 172.30.0.2
 no bgp ebgp-requires-policy
 neighbor 172.30.0.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.51.100.0/24
  neighbor 172.30.0.1 activate
 exit-address-family
!
ip route 203.0.113.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
