      - 4. RPKI, four states: wiki/4-rpki-four-states.md
      - 5. Router versus Internet: wiki/5-router-versus-internet.md
      - 6. A traceroute that stops: wiki/6-traceroute-that-stops.md
      - 7. Connecting a router: wiki/7-connecting-a-router.md
      - 8. Publishing it: wiki/8-publishing-it.md
      - 9. When something looks wrong: wiki/9-when-something-looks-wrong.md
      - 10. Adding a vendor: wiki/10-adding-a-vendor.md
  - Operations:
