# The documentation site.
#
# Same content as the repository: docs/ is the source, this only decides how it
# is presented. Built and served by Dockerfile.docs; see docs/operations for how
# to run it.

site_name: NOGGlass
site_description: Multi-vendor looking glass for ISPs
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  # System fonts rather than Google's: the site is meant to work on an
  # operator's own network, and a page that waits on fonts.googleapis.com is a
  # page that loads slowly exactly when the Internet is the thing being
  # debugged. Nothing here is loaded from outside the container.
  font: false
  palette:
    # Dark first, like the product: a looking glass is often opened at 3 a.m.
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# MkDocs excludes a top-level templates/ directory by default, to avoid
# confusion with a theme's Jinja templates. Ours holds the document template
# contributors copy, which belongs on the site.
exclude_docs: |
  !/templates/

