# NOGGlass main configuration file.
#
# Copy this file to /etc/nogglass/nogglass.conf and edit it.
# NOGGlass loads its configuration from this file, and automatically discovers
# companion configuration files in the same directory:
#   - /etc/nogglass/routers.conf (router inventory)
#   - /etc/nogglass/ui.conf      (user interface & visual styling)
# Permissions: chmod 600 /etc/nogglass/*.conf

# ---------------------------------------------------------------------------
# Server and HTTP listener settings.
# ---------------------------------------------------------------------------

[server]
# Address and port on which NOGGlass listens (default: 0.0.0.0:8080).
http_addr = "0.0.0.0:8080"

# Secret key used to sign and verify CAPTCHA challenge tokens.
# Change this to a secure random string (32 characters or more) in production.
captcha_secret = "generate_a_random_secret_string_here_32_chars_or_more"

[limits]
# Wall-clock budget for one command, in seconds.
timeout_secs = 30
# Router output kept per query. Anything past this is dropped and the answer is
# flagged as truncated. Sized to 2 MB (2097152 bytes) to accommodate structured
# JSON from platforms like Juniper JunOS while matching the SSH buffer ceiling.
max_output_bytes = 2097152
# Probes per ping. Clamped to 20 whatever is configured here.
ping_count = 5
# Queries that may run at once against one router. Keep this low: the CPU you
# are spending belongs to a production control plane.
max_concurrent_per_router = 2
# Queries that may run at once across the whole instance.
max_concurrent_total = 16

# ---------------------------------------------------------------------------
# RPKI validation (ADR-0010).
#
# Tier 1 is whatever your router reported: if it has an RTR session, its answer
# is used and nothing leaves your network.
#
# Tier 2 fills the blanks for routers that report nothing. It is OFF by default.
# With enable_fallback and no validator_url, NOGGlass asks RIPEstat, which means
# the queried prefix and origin AS leave your network — mention it in your
# privacy notice, or point validator_url at your own validator.
# ---------------------------------------------------------------------------

[rpki]
enable_fallback = false
# validator_url = "http://routinator.internal:8323"
timeout_ms = 3000
cache_ttl_secs = 3600
cache_max_capacity = 50000

# ---------------------------------------------------------------------------
# Rate limiting.
#
# The limits above bound one query. These bound how many queries one visitor
# gets. On a public instance, leave this on: without it a single stranger
# decides how much control-plane CPU your routers spend.
#
# IPv6 is counted per /64, not per address, because one visitor holds a whole
# /64 and counting per address counts nothing.
#
# trusted_proxies: only these addresses have their X-Forwarded-For believed.
# Leave it empty when nothing sits in front. Listing an address you do not
# control hands that address an unlimited allowance.
# ---------------------------------------------------------------------------

[rate_limit]
enabled = true
max_requests = 20
window_secs = 60
burst = 5
# Interval in seconds within which subsequent queries require CAPTCHA challenge (default 60)
require_captcha_within_secs = 60
trusted_proxies = []
# trusted_proxies = ["192.0.2.1", "2001:db8::1"]

# ---------------------------------------------------------------------------
# Global view.
#
# Shows what the Internet announces for the queried prefix next to what your
# router answered, which is how a leak, a hijack or an announcement that never
# propagated becomes visible.
#
# OFF by default: it sends the queried prefix to RIPEstat, so it leaves your
# network and belongs in your privacy notice.
# ---------------------------------------------------------------------------

[global_view]
enabled = false
timeout_ms = 1500
