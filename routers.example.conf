# NOGGlass router inventory.
#
# Copy this file to /etc/nogglass/routers.conf and edit it.
# NOGGlass automatically loads this file when present in the same directory
# as nogglass.conf (or configured via NOGGLASS_ROUTERS_CONFIG).
#
# This file carries NO secrets. Passwords and key passphrases are named here and
# read from the environment, so the file itself can live in version control.
#
# Each router is defined in a [[router]] block:
#   id          stable, appears in URLs — do not change it after publishing
#   name        what visitors see
#   vendor      one of: huawei_vrp, cisco_iosxe, cisco_iosxr, juniper_junos,
#               nokia_sros, mikrotik_routeros, datacom_dmos,
#               bird_routing_daemon, arista_eos, frr, mock
#   host        management address; never shown to visitors
#   username    the read-only user you created for NOGGlass
#   credentials password_env = "VAR", or key_file = { path = "...",
#               passphrase_env = "VAR" }
#   host_key    OpenSSH public key ("ssh-ed25519 AAAA..."); recommended in production
#               to pin the router identity and prevent Man-in-the-Middle attacks
#   allow_insecure_host_key  boolean; defaults to false. Set to true ONLY in lab/dev
#               environments to allow unverified host keys.
#   location    grouping in the selector, usually a POP or a city
#   queries     which queries this router answers: "ping", "traceroute", "bgp_route",
#               "bgp_aspath" (IPv4 AS-Path regex matching neighbor peer ASN),
#               "bgp_aspath_v6" (IPv6 AS-Path regex matching neighbor peer ASN), "bgp_summary".
#               Omit to allow default safe queries (ping, traceroute, bgp_route, bgp_summary).
#               NOTE: "bgp_aspath" and "bgp_aspath_v6" are opt-in and omitted on large Tier 1 transit
#               borders to protect control-plane CPU against regex full-table scans.
# ---------------------------------------------------------------------------

[[router]]
id = "edge-01"
name = "Edge 01"
vendor = "huawei_vrp"
host = "192.0.2.10"
# host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICc7T1sX7Zq4eN18Hq9T0kL1m3oV5yP7rS9tU2vW4xY0"
allow_insecure_host_key = true # Set to true for lab testing without pinned host keys
username = "nogglass"
location = "Sao Paulo"
credentials = { password_env = "NOGGLASS_EDGE01_PASSWORD" }
queries = ["ping", "traceroute", "bgp_route", "bgp_summary"]

[[router]]
id = "border-02"
name = "Border 02"
vendor = "juniper_junos"
host = "192.0.2.11"
allow_insecure_host_key = true # Set to true for lab testing without pinned host keys
username = "nogglass"
location = "Rio de Janeiro"
credentials = { key_file = { path = "/etc/nogglass/keys/border-02", passphrase_env = "NOGGLASS_BORDER02_PASSPHRASE" } }

# The mock router answers from fixtures and never opens a session. Useful for
# trying NOGGlass out, and for a public demo. Its answers are fabricated and the
# interface says so.
[[router]]
id = "demo"
name = "Demo router"
vendor = "mock"
host = "127.0.0.1"
location = "Fixtures"
