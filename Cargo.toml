# Workspace root. One lockfile and one target directory for every crate, so a
# release build and CI agree on the exact dependency versions.
[workspace]
resolver = "2"
members = ["crates/looking-glass-core", "crates/nogglass-server"]

[workspace.package]
version = "1.0.0"
edition = "2021"
# LazyLock (core) requires 1.80; CI pins the exact toolchain.
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
looking-glass-core = { path = "crates/looking-glass-core" }
async-trait = "0.1"
ipnet = { version = "2.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
ring = "0.17"

[profile.release]
# Strip at link time rather than with a separate `strip` call: the builder runs
# on amd64 and cross-compiles, and host binutils cannot read an aarch64 binary.
# The linker always can.
strip = "symbols"

[patch.crates-io]
# Temporary: one-line fix to a NetGauze 0.13.0 session-reset bug (#171).
# Remove with vendor/netgauze-bgp-speaker once the fix is released upstream.
netgauze-bgp-speaker = { path = "vendor/netgauze-bgp-speaker" }
